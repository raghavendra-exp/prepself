<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="compassBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7f3e6"/>
      <stop offset="100%" stop-color="#e3dac0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- Outer Rim -->
  <circle cx="64" cy="64" r="60" fill="url(#compassBg)" stroke="#1b2a33" stroke-width="4"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#8f8462" stroke-width="1.5" stroke-dasharray="2 2"/>
  
  <!-- Cardinal Ticks -->
  <line x1="64" y1="8" x2="64" y2="16" stroke="#1b2a33" stroke-width="2.5"/>
  <line x1="64" y1="112" x2="64" y2="120" stroke="#1b2a33" stroke-width="2.5"/>
  <line x1="8" y1="64" x2="16" y2="64" stroke="#1b2a33" stroke-width="2.5"/>
  <line x1="112" y1="64" x2="120" y2="64" stroke="#1b2a33" stroke-width="2.5"/>
  
  <!-- Mountains Silhouette -->
  <polygon points="32,78 52,50 68,70 82,44 100,78" fill="#1b2a33" opacity="0.9"/>
  <!-- Mountain Snowcaps -->
  <polygon points="52,50 46,58 58,58" fill="#f7f3e6"/>
  <polygon points="82,44 76,54 88,54" fill="#f7f3e6"/>
  
  <!-- Meandering River -->
  <path d="M 44,78 Q 54,88 64,84 T 84,92" fill="none" stroke="url(#riverGrad)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Compass Star Needle -->
  <polygon points="64,20 68,54 64,64 60,54" fill="url(#goldGrad)"/>
  <polygon points="64,64 68,74 64,108 60,74" fill="#4d5d63"/>
  <polygon points="20,64 54,60 64,64 54,68" fill="#8f8462"/>
  <polygon points="64,64 74,60 108,64 74,68" fill="#8f8462"/>
  
  <!-- Center Pivot -->
  <circle cx="64" cy="64" r="5" fill="#1b2a33" stroke="#f7f3e6" stroke-width="1.5"/>
</svg>
