    <script>
      // Global cache and worker purge helper
      window.resetAppAndCaches = function() {
        const statusEl = document.getElementById('loader-status');
        if (statusEl) statusEl.innerText = 'Purging cache & refreshing...';
        
        const clearWorkers = 'serviceWorker' in navigator 
          ? navigator.serviceWorker.getRegistrations().then(regs => Promise.all(regs.map(r => r.unregister())))
          : Promise.resolve();
          
        const clearCaches = 'caches' in window 
          ? caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k))))
          : Promise.resolve();

        Promise.all([clearWorkers, clearCaches]).then(() => {
          window.location.reload(true);
        }).catch(() => {
          window.location.reload(true);
        });
      };

      // Auto-reload on Vite preload errors (chunk hash mismatch after updates)
      window.addEventListener('vite:preloadError', (event) => {
        console.warn('Vite preload error detected, refreshing application...', event);
        window.location.reload();
      });

      // Service Worker registration with proactive update check
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then((registration) => {
              // Immediately check for updates
              registration.update();

              // Listen for waiting workers and activate immediately
              if (registration.waiting) {
                registration.waiting.postMessage({ action: 'skipWaiting' });
              }

              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      newWorker.postMessage({ action: 'skipWaiting' });
                    }
                  });
                }
              });
            })
            .catch((err) => {
              console.warn('Service worker registration error:', err);
            });
        });

        // Reload on controller change to ensure users run fresh code
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }

      // Show recovery button after 3.5s if React hasn't mounted
      setTimeout(() => {
        const resetBtn = document.getElementById('loader-reset-btn');
        if (resetBtn && document.getElementById('app-loader-wrapper')) {
          resetBtn.style.display = 'inline-block';
        }
      }, 3500);

      // Catch unhandled script loading errors
      window.addEventListener('error', (event) => {
        if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
          const statusEl = document.getElementById('loader-status');
          const resetBtn = document.getElementById('loader-reset-btn');
          if (statusEl) {
            statusEl.innerHTML = '<span style="color: #dc2626; font-weight: 600;">नया अपडेट उपलब्ध है। कृपया कैश साफ़ करके रीलोड करें:</span>';
          }
          if (resetBtn) {
            resetBtn.style.display = 'inline-block';
          }
        }
      }, true);
    </script>
